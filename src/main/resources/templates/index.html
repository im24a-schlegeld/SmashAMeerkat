<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Smash-A-Meerkat</title>
    <link rel="stylesheet" href="/css/game.css">
    <script defer src="/js/game.js"></script>
</head>
<body>
    <header>
        <h1>Smash-A-Meerkat</h1>
        <div>
            <span id="status">Start</span>
            <span id="score">Score: 0</span>
        </div>
    </header>

    <section id="grid" aria-label="Game board">
        <div class="hole" data-key="A" data-state=""><span class="key">A</span></div>
        <div class="hole" data-key="S" data-state=""><span class="key">S</span></div>
        <div class="hole" data-key="D" data-state=""><span class="key">D</span></div>
        <div class="hole" data-key="J" data-state=""><span class="key">J</span></div>
        <div class="hole" data-key="K" data-state=""><span class="key">K</span></div>
    </section>
</body>
</html>
